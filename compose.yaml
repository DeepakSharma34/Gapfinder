services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: gapfinder
      POSTGRES_PASSWORD: gapfinder
      POSTGRES_DB: gapfinder
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gapfinder"]
      interval: 5s
      timeout: 3s
      retries: 10
  qdrant:
    image: qdrant/qdrant:v1.16.3
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
volumes:
  postgres_data:
  qdrant_data:
